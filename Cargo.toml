[package]
name = "crosstraffic_middleware"
version = "0.3.13"
authors = ["Rei Tamaru <tamaru@wisc.edu>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Middleware for transporations library and the software applications."
documentation = "https://docs.rs/cross-traffic-middleware"
repository = "https://github.com/crosstraffic/cross-traffic-middleware"
readme = "README.md"
exclude = [
    ".gitignore",
]

[dependencies]
wasm-bindgen = "0.2.90"
serde = { version = "1.0", features = ["derive"]}
serde-wasm-bindgen = "0.4"
# 0.3.6 is not on crates.io yet: it exports WEAVE_INFLUENCE_EXTENSION_FT, which the
# binding below reads. The path entry resolves it locally from the sibling checkout, so
# this crate builds and tests before the library is published; the version entry is what
# a crates.io consumer resolves against, so publish the library first, then this crate,
# or the published 0.3.13 will not resolve.
transportations_library = { version = "0.3.6", path = "../transportations-library" }
js-sys = "0.3.67"

[lib]
name = "crosstraffic_middleware"
crate-type = ["cdylib", "rlib"]
