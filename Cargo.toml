[package]
name = "crosstraffic_middleware"
version = "0.3.9"
authors = ["Rei Tamaru <tamaru@wisc.edu>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Middleware for transporations library and the software applications."
documentation = "https://docs.rs/cross-traffic-middleware"
repository = "https://github.com/crosstraffic/cross-traffic-middleware"
readme = "README.md"
exclude = [
    ".gitignore",
]

[dependencies]
wasm-bindgen = "0.2.90"
serde = { version = "1.0", features = ["derive"]}
serde-wasm-bindgen = "0.4"
# 0.3.4 is not on crates.io yet: the Chapter 23 protected-plus-permitted left turns
# and the SPUI of Example Problem 7 land there. Publish the library first, then this
# crate, or the published 0.3.9 will not resolve.
transportations_library = { version = "0.3.4", path = "../transportations-library" }
js-sys = "0.3.67"

[lib]
name = "crosstraffic_middleware"
crate-type = ["cdylib", "rlib"]
